name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: HTTP smoke test
        run: |
          DATA_DIR=.data-smoke npx next start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/status > /dev/null && break; sleep 1; done
          npm run smoke

  analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/analysis/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
