services:
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["3000:3000"]
    environment:
      - PYTHON_SERVICE_URL=http://analysis:8000
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-5-5}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-60000}
      - DATA_DIR=/data
      - DATASET_RETENTION_HOURS=${DATASET_RETENTION_HOURS:-24}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-26214400}
      - MAX_ROWS=${MAX_ROWS:-250000}
      - MAX_QUERY_ROWS=${MAX_QUERY_ROWS:-1000}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-10000}
      - PYTHON_TIMEOUT_MS=${PYTHON_TIMEOUT_MS:-15000}
    volumes:
      - insightlab-data:/data
    depends_on: [analysis]
  analysis:
    build: { context: ./services/analysis }
    # No published port: reachable only on the compose network.
    expose: ["8000"]
    # Defence in depth for the code sandbox.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 64
    # network_mode is intentionally NOT "none": web must reach it.

volumes:
  insightlab-data:
